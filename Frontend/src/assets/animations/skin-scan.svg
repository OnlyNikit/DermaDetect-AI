<svg
  viewBox="0 0 400 400"
  preserveAspectRatio="xMidYMid meet"
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  height="100%"
  style="display:block; max-width:100%; height:auto; aspect-ratio:1/1; border-radius:40px; background:#101f1f;"
>
  <defs>
    <radialGradient id="skinGrad" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#F0C4A4"/>
      <stop offset="55%" stop-color="#E0A47F"/>
      <stop offset="100%" stop-color="#B97A5C"/>
    </radialGradient>

    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="0"/>
      <stop offset="45%" stop-color="#4FD1C5" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#4FD1C5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(79,209,197,0.08)" stroke-width="1"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="400" height="400"  rx="40"  ry="40" />
    </clipPath>
  </defs>

  <style>
    .lens-group { transform-box: fill-box; }
    .marker { transition: opacity .3s ease; }
    .marker:hover circle:first-child { stroke-width: 2.4; }
    .hud-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      fill: #7FA79E;
    }
    .hud-count {
      font-family: Georgia, 'Iowan Old Style', serif;
      font-size: 26px;
      fill: #EAF3F1;
    }
    .hud-value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      fill: #EAF3F1;
    }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- base panel -->
    <rect width="400" height="400" rx="40" ry="40" fill="#0F1D1D"/>

    <!-- organic skin patch -->
    <path
      d="M 200 90
         C 270 88, 320 130, 322 200
         C 324 270, 275 320, 202 318
         C 130 316, 80 268, 80 200
         C 80 132, 130 92, 200 90 Z"
      fill="url(#skinGrad)" opacity="0.9"/>

    <!-- texture freckles -->
    <g opacity="0.35" fill="#7a4a34">
      <circle cx="176" cy="140" r="1.1"/><circle cx="243" cy="151" r="0.8"/><circle cx="211" cy="128" r="1.3"/>
      <circle cx="158" cy="169" r="0.7"/><circle cx="264" cy="182" r="1.0"/><circle cx="192" cy="160" r="0.6"/>
      <circle cx="230" cy="197" r="1.2"/><circle cx="140" cy="204" r="0.9"/><circle cx="278" cy="221" r="1.1"/>
      <circle cx="205" cy="220" r="0.7"/><circle cx="165" cy="236" r="1.0"/><circle cx="250" cy="246" r="0.8"/>
      <circle cx="221" cy="266" r="1.2"/><circle cx="184" cy="278" r="0.9"/><circle cx="147" cy="255" r="0.7"/>
      <circle cx="260" cy="270" r="1.0"/><circle cx="198" cy="290" r="0.8"/><circle cx="130" cy="220" r="1.1"/>
      <circle cx="290" cy="200" r="0.9"/><circle cx="172" cy="200" r="0.7"/><circle cx="235" cy="230" r="1.0"/>
    </g>

    <!-- lesion markers with pulsing "watch" rings -->
    <g class="marker">
      <circle cx="170" cy="175" r="10" fill="none" stroke="#4FD1C5" stroke-width="1.4"/>
      <circle cx="170" cy="175" r="2.2" fill="#4FD1C5"/>
    </g>
    <g class="marker">
      <circle cx="235" cy="160" r="10" fill="none" stroke="#FF7A59" stroke-width="1.4">
        <animate attributeName="r" values="8;16;8" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0.9" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="235" cy="160" r="2.2" fill="#FF7A59"/>
    </g>
    <g class="marker">
      <circle cx="210" cy="245" r="10" fill="none" stroke="#4FD1C5" stroke-width="1.4"/>
      <circle cx="210" cy="245" r="2.2" fill="#4FD1C5"/>
    </g>
    <g class="marker">
      <circle cx="150" cy="235" r="10" fill="none" stroke="#FF7A59" stroke-width="1.4">
        <animate attributeName="r" values="8;16;8" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0.9" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="235" r="2.2" fill="#FF7A59"/>
    </g>

    <!-- grid overlay -->
    <rect width="400" height="400" rx="40" ry="40" fill="url(#grid)"/>

    <!-- moving scan beam -->
    <rect x="0" y="-90" width="400" height="90" fill="url(#beamGrad)">
      <animate attributeName="y" values="-90;400;-90" dur="3.4s" repeatCount="indefinite"/>
    </rect>

    <!-- roaming lens ring: cycles between the marker points -->
    <g class="lens-group">
      <circle r="46" fill="none" stroke="#4FD1C5" stroke-width="1.5" opacity="0.9">
        <animate attributeName="cx" values="200;170;235;210;150;200" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="200;175;160;245;235;200" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle r="2" fill="#4FD1C5">
        <animate attributeName="cx" values="200;170;235;210;150;200" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="200;175;160;245;235;200" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- outer border -->
    <rect x="1" y="1" width="398" height="398" rx="39" ry="39" fill="none" stroke="rgba(79,209,197,0.25)" stroke-width="1"/>

    <!-- ===== HUD text, baked into the SVG ===== -->

    <!-- top-left: "Scanning" with blinking red dot -->
    <g>
      <circle cx="20" cy="21" r="3" fill="#FF7A59">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="25" class="hud-text" fill="#FF7A59">Scanning</text>
    </g>

    <!-- top-right: "Analyzing texture…" -->
    <text x="380" y="25" text-anchor="end" class="hud-text">Analyzing texture&#8230;</text>

    <!-- bottom-left: "Spots detected" label + live count -->
    <text x="20" y="345" class="hud-text">Spots detected</text>
    <g>
      <text x="20" y="378" class="hud-count" opacity="1">0
        <animate attributeName="opacity" begin="0.9s" dur="0.01s" fill="freeze" to="0"/>
      </text>
      <text x="20" y="378" class="hud-count" opacity="0">1
        <animate attributeName="opacity" begin="0.9s" dur="0.01s" fill="freeze" to="1"/>
        <animate attributeName="opacity" begin="1.55s" dur="0.01s" fill="freeze" to="0"/>
      </text>
      <text x="20" y="378" class="hud-count" opacity="0">2
        <animate attributeName="opacity" begin="1.55s" dur="0.01s" fill="freeze" to="1"/>
        <animate attributeName="opacity" begin="2.2s" dur="0.01s" fill="freeze" to="0"/>
      </text>
      <text x="20" y="378" class="hud-count" opacity="0">3
        <animate attributeName="opacity" begin="2.2s" dur="0.01s" fill="freeze" to="1"/>
        <animate attributeName="opacity" begin="2.85s" dur="0.01s" fill="freeze" to="0"/>
      </text>
      <text x="20" y="378" class="hud-count" opacity="0">4
        <animate attributeName="opacity" begin="2.85s" dur="0.01s" fill="freeze" to="1"/>
      </text>
    </g>

    <!-- bottom-right: "Confidence" label + live value -->
    <text x="380" y="345" text-anchor="end" class="hud-text">Confidence</text>
    <g text-anchor="end">
      <text x="380" y="368" class="hud-value" opacity="1">&#8212;
        <animate attributeName="opacity" begin="0.9s" dur="0.01s" fill="freeze" to="0"/>
      </text>
      <text x="380" y="368" class="hud-value" opacity="0">93%
        <animate attributeName="opacity" begin="0.9s" dur="0.01s" fill="freeze" to="1"/>
        <animate attributeName="opacity" begin="1.55s" dur="0.01s" fill="freeze" to="0"/>
      </text>
      <text x="380" y="368" class="hud-value" opacity="0">94%
        <animate attributeName="opacity" begin="1.55s" dur="0.01s" fill="freeze" to="1"/>
        <animate attributeName="opacity" begin="2.2s" dur="0.01s" fill="freeze" to="0"/>
      </text>
      <text x="380" y="368" class="hud-value" opacity="0">95%
        <animate attributeName="opacity" begin="2.2s" dur="0.01s" fill="freeze" to="1"/>
        <animate attributeName="opacity" begin="2.85s" dur="0.01s" fill="freeze" to="0"/>
      </text>
      <text x="380" y="368" class="hud-value" opacity="0">96%
        <animate attributeName="opacity" begin="2.85s" dur="0.01s" fill="freeze" to="1"/>
      </text>
    </g>
  </g>
</svg>
